  #hud p{font-size:11px;margin:0;opacity:.75}
  #stats{position:fixed;bottom:12px;left:16px;color:#9fb0c3;font-size:11px;pointer-events:none;z-index:2}
</style>

<body>
<div id="hud"><h1>Voxel Pagoda Garden &mdash; Deluxe</h1><p>drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p></div>
<div id="stats"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
window.__step = 'module start';
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__step = 'imports ok';
try {
/* ================= voxel store ================= */
const V = new Map();
const K = (x,y,z) => x+'|'+y+'|'+z;
const put = (x,y,z,c) => V.set(K(x,y,z), c);
const del = (x,y,z) => V.delete(K(x,y,z));
const hash = (x,y,z) => { let h=(x*374761393+y*668265263+z*1274126177)|0; h=(h^(h>>13))*1274126177|0; return ((h^(h>>16))>>>0)/4294967295; };
const lerpN=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const vnoise=(x,z)=>{const xi=Math.floor(x),zi=Math.floor(z),xf=smooth(x-xi),zf=smooth(z-zi);
  const a=hash(xi,0,zi),b=hash(xi+1,0,zi),c=hash(xi,0,zi+1),d=hash(xi+1,0,zi+1);
  return lerpN(lerpN(a,b,xf),lerpN(c,d,xf),zf);};
const shade = (c,f) => { const r=Math.min(255,((c>>16)&255)*f|0), g=Math.min(255,((c>>8)&255)*f|0), b=Math.min(255,(c&255)*f|0); return (r<<16)|(g<<8)|b; };
const jit = (c,x,y,z,amt) => shade(c, 1 - amt/2 + hash(x,y,z)*amt);
const pick = (arr,x,y,z) => arr[Math.floor(hash(x,y,z)*arr.length)];
const fill=(x0,x1,y0,y1,z0,z1,c)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)put(x,y,z,c);};
const carve=(x0,x1,y0,y1,z0,z1)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)del(x,y,z);};
const ring=(half,y,c)=>{for(let x=-half;x<=half;x++)for(let z=-half;z<=half;z++)
  if(Math.abs(x)===half||Math.abs(z)===half)put(x,y,z,jit(c,x,y,z,0.10));};
const slab=(half,y,c)=>{for(let x=-half;x<=half;x++)for(let z=-half;z<=half;z++)put(x,y,z,jit(c,x,y,z,0.08));};

const C = {
  grass:[0x3f7d3a,0x4a8f42,0x357033,0x52964a,0x3b8038&0xffffff], dirt:0x5a4632,
  gravel:0x9a948a, stone:0x8d857c, stoneDark:0x6f695f,
  wood:0x9c3b34, woodDark:0x6e2a24, woodMid:0x84332d, floor:0x7a4a2b,
  roof:0x33415c, roofEdge:0x27334a, roofRidge:0x1f293d,
  gold:0xd9a441, goldDark:0xb08030,
  trunk:0x6b4a2b, leaf:[0x2f6e2f,0x3c7f38,0x2a5c2a], pine:[0x275c33,0x1f4a29,0x316b3c],
  maple:[0xd07b3f,0xb8562f,0xe0a04f], cherry:[0xe8a7b8,0xd9869e,0xf2c2cf],
  bamboo:[0x5f9e4f,0x4e8a40], bambooLeaf:[0x74b05e,0x619950],
  rock:0x7d7d84, rockDark:0x63636b, lantern:0xffc46b,
  water:0x2e6fa8, koi:[0xe8763a,0xf2f2f2,0xd8433a], lily:0x3f8f4a,
  flower:[0xd8577a,0xe0c04f,0xe8e8e8,0xb07ad8], torii:0xc23a2e
};
C.grass[4]=0x3b8038;

/* ================= terrain ================= */
const G = 40;
const PC = {x:16, z:14, rx:5.5, rz:4.5};
const TH = {x:-16, z:14};                       // tea house center
const pondD = (x,z)=>((x-PC.x)/PC.rx)**2+((z-PC.z)/PC.rz)**2;
const flatZones = [
  [-9,9,-9,9],                                   // pagoda
  [TH.x-5,TH.x+5,TH.z-5,TH.z+5],                 // tea house
  [PC.x-8,PC.x+8,PC.z-7,PC.z+7],                 // pond + bridge
  [-3,3,8,44],                                   // main path
  [-24,-14,2,10],                         // rock garden
  [-22,-10,-24,-16], [-22,-10,26,38], [12,26,-26,-14], [22,34,22,36] // tree pads
];
const inZone=(x,z)=>flatZones.some(([a,b,c,d])=>x>=a&&x<=b&&z>=c&&z<=d);
function terrainH(x,z){
  if (inZone(x,z)) return 0;
  const d = Math.max(Math.abs(x),Math.abs(z));
  if (d < 11) return 0;
  const ramp = Math.min(1,(d-11)/10);
  const n = vnoise(x*0.11+50, z*0.11+50)*0.75 + vnoise(x*0.31+9, z*0.31+9)*0.25;
  return Math.floor(n*5*ramp);
}
for (let x=-G; x<=G; x++) for (let z=-G; z<=G; z++) {
  const h = terrainH(x,z);
  for (let y=-1; y<=h; y++)
    put(x,y,z, y===h ? pick(C.grass,x,y,z) : jit(C.dirt,x,y,z,0.18));
}

/* ================= pond ================= */
const waterKeys = [];
for (let x=-G; x<=G; x++) for (let z=-G; z<=G; z++) {
  const d = pondD(x,z);
  if (d <= 1) {
    const h = terrainH(x,z);
    for (let y=0; y<=h; y++) del(x,y,z);
    put(x,1,z,C.water); waterKeys.push([x,z]);
  }
}
for (const [lx,lz] of [[13,12],[17,12],[15,16],[19,15],[12,15],[18,11]]) put(lx,2,lz,C.lily);
for (const [kx,kz] of [[15,13],[17,14],[14,14],[19,13],[16,16]]) put(kx,2,kz,pick(C.koi,kx,2,kz));

/* stepping stones across pond edge */
for (const [sx,sz] of [[10,13],[9,14],[8,15]]) put(sx,2,sz,jit(C.stone,sx,2,sz,0.10));

/* ================= rock mound + waterfall ================= */
const RC = {x:21, z:9};
for (let dx=-3; dx<=3; dx++) for (let dz=-3; dz<=3; dz++) for (let dy=0; dy<=6; dy++) {
  const r = 3.1 - dy*0.42;
  if (dx*dx+dz*dz <= r*r && hash(RC.x+dx,dy,RC.z+dz) > 0.08)
    put(RC.x+dx,dy,RC.z+dz, pick([C.rock,C.rockDark],RC.x+dx,dy,RC.z+dz));
}
for (let dy=2; dy<=5; dy++){ put(20,dy,11,0x5fb8d8); put(20,dy,12,0x4a9ac8); }  // waterfall sheet

/* ================= paths ================= */
for (let z=9; z<=44; z++) for (let x=-1; x<=1; x++) put(x,0,z, jit(C.stone,x,0,z,0.12));
for (let x=2; x<=11; x++) for (let z=13; z<=15; z++) put(x,0,z, jit(C.stone,x,0,z,0.12));   // to bridge
for (let x=-15; x<=-8; x++) for (let z=13; z<=15; z++) put(x,0,z, jit(C.stone,x,0,z,0.12));  // to tea house
for (let x=-1; x<=1; x++) for (let z=-9; z>=-14; z--) put(x,0,z, jit(C.stone,x,0,z,0.12)); // north path

/* ================= zigzag bridge over pond ================= */
const bridgeSegs = [[10,14,14,11],[11,11,11,17],[17,17,17,12]]; // x0,x1,z0,z1 style segments
function bridgeSeg(x0,x1,z0,z1){
  for (let x=x0;x<=x1;x++) for (let z=z0;z<=z1;z++) put(x,2,z,jit(C.woodMid,x,2,z,0.10));
  for (let x=x0;x<=x1;x++){ if(hash(x,9,z0)>0.35){put(x,3,z0,C.woodDark);put(x,4,z0,C.woodDark);} if(hash(x,9,z1)>0.35){put(x,3,z1,C.woodDark);put(x,4,z1,C.woodDark);} }
  for (let z=z0;z<=z1;z++){ if(hash(x0,9,z)>0.35){put(x0,3,z,C.woodDark);put(x0,4,z,C.woodDark);} if(hash(x1,9,z)>0.35){put(x1,3,z,C.woodDark);put(x1,4,z,C.woodDark);} }
}
bridgeSeg(10,12,13,15); bridgeSeg(12,14,12,14); bridgeSeg(14,16,13,15);

/* ================= torii gates ================= */
function torii(tx,tz){
  for (const sx of [-1,1]) { for (let y=1; y<=6; y++) put(tx+3*sx,y,tz,C.torii); put(tx+4*sx,1,tz,C.stoneDark); }
  for (let x=-4; x<=4; x++){ const y = 7 + (Math.abs(x)>=3?1:0); put(tx+x,y,tz,C.torii); put(tx+x,y+1,tz,C.woodDark); }
  for (let x=-3; x<=3; x++) put(tx+x,5,tz,C.torii);
  put(tx,6,tz,C.gold);
}
torii(0,20); torii(9,16);

/* ================= pagoda ================= */
// double stone base + balustrade
for (let x=-7; x<=7; x++) for (let z=-7; z<=7; z++) { put(x,0,z,jit(C.stone,x,0,z,0.08)); put(x,1,z,jit(C.stoneDark,x,1,z,0.08)); }
for (let x=-7; x<=7; x++) for (let z=-7; z<=7; z++)
  if (Math.abs(x)===7 || Math.abs(z)===7) put(x,2,z,jit(C.stone,x,2,z,0.08));
for (const [px,pz] of [[-7,-7],[7,-7],[-7,7],[7,7],[0,-7],[0,7],[-7,0],[7,0]]) { put(px,3,pz,C.stone); put(px,4,pz,C.goldDark); }
// south steps
for (let x=-2; x<=2; x++){ put(x,1,8,C.stone); put(x,1,9,C.stone); put(x,0,10,C.stone); }

// tier 1 (walls y3..8)
for (let y=3; y<=8; y++) ring(5,y,C.wood);
for (const sx of [-1,1]) for (const sz of [-1,1]) for (let y=3; y<=9; y++) put(5*sx,y,5*sz,C.woodDark);
fill(-4,4,2,-4,4,C.floor);                                   // interior floor
carve(-1,1,3,6,5);                                           // door
put(0,3,2,C.gold); put(0,4,2,C.gold); put(0,5,2,C.gold); put(0,6,2,C.goldDark); put(0,7,2,C.gold);  // buddha
for (const [wx,wz] of [[-3,5],[3,5],[5,3],[5,-3],[-5,3],[-5,-3],[3,-5],[-3,-5]]) for (let y=5; y<=6; y++) put(wx,y,wz,C.gold);
// bracket clusters under roof 1
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(5*sx,9,5*sz,C.woodDark); put(6*sx,9,6*sz,C.woodDark); }
for (const s of [-1,1]) { put(0,9,5*s,C.woodDark); put(0,9,6*s,C.woodDark); put(5*s,9,0,C.woodDark); put(6*s,9,0,C.woodDark); }
// roof 1
slab(6,10,C.roof); slab(5,11,C.roof); slab(4,12,C.roof);
for (const sx of [-1,1]) for (const sz of [-1,1]) {
  put(7*sx,10,7*sz,C.roofEdge); put(8*sx,11,8*sz,C.roofEdge); put(8*sx,12,8*sz,C.roofRidge);
  put(7*sx,11,7*sz,C.goldDark);
}
for (const s of [-1,1]) { put(6*s,12,0,C.roofRidge); put(0,12,6*s,C.roofRidge); }

// tier 2 (walls y13..17)
for (let y=13; y<=17; y++) ring(4,y,C.wood);
for (const sx of [-1,1]) for (const sz of [-1,1]) for (let y=13; y<=18; y++) put(4*sx,y,4*sz,C.woodDark);
for (const [wx,wz] of [[0,4],[0,-4],[4,0],[-4,0]]) for (let y=14; y<=16; y++) put(wx,y,wz,C.gold);
for (const s of [-1,1]) { put(0,18,4*s,C.woodDark); put(4*s,18,0,C.woodDark); put(0,18,5*s,C.woodDark); put(5*s,18,0,C.woodDark); }
slab(5,19,C.roof); slab(4,20,C.roof);
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(6*sx,19,6*sz,C.roofEdge); put(7*sx,20,7*sz,C.roofEdge); put(7*sx,21,7*sz,C.roofRidge); put(6*sx,20,6*sz,C.goldDark); }

// tier 3 (walls y21..24)
for (let y=21; y<=24; y++) ring(3,y,C.wood);
for (const sx of [-1,1]) for (const sz of [-1,1]) for (let y=21; y<=25; y++) put(3*sx,y,3*sz,C.woodDark);
for (const [wx,wz] of [[0,3],[0,-3],[3,0],[-3,0]]) for (let y=22; y<=23; y++) put(wx,y,wz,C.gold);
for (const s of [-1,1]) { put(0,25,3*s,C.woodDark); put(3*s,25,0,C.woodDark); put(0,25,4*s,C.woodDark); put(4*s,25,0,C.woodDark); }
slab(4,26,C.roof); slab(3,27,C.roof);
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(5*sx,26,5*sz,C.roofEdge); put(6*sx,27,6*sz,C.roofEdge); put(6*sx,28,6*sz,C.roofRidge); put(5*sx,27,5*sz,C.goldDark); }

// tier 4 (walls y28..30)
for (let y=28; y<=30; y++) ring(2,y,C.wood);
for (const sx of [-1,1]) for (const sz of [-1,1]) for (let y=28; y<=31; y++) put(2*sx,y,2*sz,C.woodDark);
for (const s of [-1,1]) { put(0,31,2*s,C.woodDark); put(2*s,31,0,C.woodDark); put(0,31,3*s,C.woodDark); put(3*s,31,0,C.woodDark); }
slab(3,32,C.roof); slab(2,33,C.roof);
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(4*sx,32,4*sz,C.roofEdge); put(5*sx,33,5*sz,C.roofEdge); put(5*sx,34,5*sz,C.roofRidge); put(4*sx,33,4*sz,C.goldDark); }

// tier 5 (walls y34..35)
for (let y=34; y<=35; y++) ring(1,y,C.wood);
for (const s of [-1,1]) { put(0,36,1*s,C.woodDark); put(1*s,36,0,C.woodDark); put(0,36,2*s,C.woodDark); put(2*s,36,0,C.woodDark); }
slab(2,37,C.roof); slab(1,38,C.roof);
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(3*sx,37,3*sz,C.roofEdge); put(3*sx,38,3*sz,C.roofRidge); }

// gold finial with rings + jewel
for (let y=39; y<=48; y++) put(0,y,0,C.gold);
for (const h of [40,42,44]) for (let x=-1; x<=1; x++) for (let z=-1; z<=1; z++)
  if (Math.abs(x)===1||Math.abs(z)===1) put(x,h,z,C.goldDark);
for (const [dx,dz] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) put(dx,49,dz,C.gold);
put(0,50,0,C.gold);

/* hanging lanterns under roof-1 eaves */
const lanternTops = [];
for (const sx of [-1,1]) for (const sz of [-1,1]) { put(6*sx,9,6*sz,C.lantern); }
// ground lanterns
const lanterns = [[3,12],[3,18],[-3,12],[-3,18],[3,24],[-3,24],[8,16],[-10,14],[19,18]];
for (const [lx,lz] of lanterns) {
  const g = terrainH(lx,lz);
  put(lx,g+1,lz,C.stoneDark); put(lx,g+2,lz,C.stoneDark); put(lx,g+3,lz,C.stoneDark);
  lanternTops.push([lx,g+4,lz]);
  put(lx,g+5,lz,C.stone);
}

/* ================= tea house ================= */
fill(TH.x-3,TH.x+3,1,1,TH.z-3,TH.z+3,C.floor);
for (let y=2; y<=4; y++) {
  for (let x=TH.x-3; x<=TH.x+3; x++) for (let z=TH.z-3; z<=TH.z+3; z++)
    if (Math.abs(x-TH.x)===3 || Math.abs(z-TH.z)===3) put(x,y,z,jit(C.woodMid,x,y,z,0.10));
}
carve(TH.x-1,TH.x+1,2,4,TH.z+3);                    // door (north side faces path)
for (const sx of [-1,1]) for (const sz of [-1,1]) for (let y=2; y<=5; y++) put(TH.x+3*sx,y,TH.z+3*sz,C.woodDark);
for (let x=TH.x-4; x<=TH.x+4; x++) for (let z=TH.z-4; z<=TH.z+4; z++)
  if (Math.abs(x-TH.x)===4 || Math.abs(z-TH.z)===4) put(x,5,z,jit(C.roof,x,5,z,0.08));
for (let x=TH.x-3; x<=TH.x+3; x++) for (let z=TH.z-3; z<=TH.z+3; z++) put(x,6,z,jit(C.roof,x,6,z,0.08));
for (let x=TH.x-2; x<=TH.x+2; x++) for (let z=TH.z-2; z<=TH.z+2; z++) put(x,7,z,C.roofRidge);
put(TH.x,8,TH.z,C.goldDark);
// tsukubachi basin + bamboo spout
fill(TH.x+4,TH.x+6,1,1,TH.z+6,TH.z+8,C.stone); put(TH.x+5,2,TH.z+7,C.water);
put(TH.x+6,3,TH.z+9,C.bamboo); put(TH.x+6,4,TH.z+9,C.bamboo); put(TH.x+6,3,TH.z+8,C.bamboo);

/* ================= rock garden (karesansui) ================= */
for (let x=-24; x<=-14; x++) for (let z=2; z<=10; z++) put(x,0,z, pick([C.gravel,shade(C.gravel,0.92)],x,0,z));
for (const [rx,rz] of [[-21,4],[-18,7],[-16,3],[-22,8],[-19,5]]) {
  for (let dx=-1; dx<=1; dx++) for (let dz=-1; dz<=1; dz++) for (let dy=0; dy<=2; dy++)
    if (hash(rx+dx,dy,rz+dz) > 0.25) put(rx+dx,dy+1,rz+dz, pick([C.rock,C.rockDark],rx+dx,dy,rz+dz));
}
// low fence around rock garden
for (let x=-24; x<=-14; x++){ if(hash(x,1,1)>0.4){put(x,1,1,C.woodDark);put(x,1,11,C.woodDark);} }
for (let z=1; z<=11; z++){ if(hash(-25,1,z)>0.4){put(-25,1,z,C.woodDark);} if(hash(-13,1,z)>0.4){put(-13,1,z,C.woodDark);} }

/* ================= bamboo groves ================= */
function bamboo(bx,bz,n){
  for (let i=0;i<n;i++){
    const px=bx+Math.floor(hash(bx+i,1,bz)*5), pz=bz+Math.floor(hash(bx+i,2,bz)*5);
    const g=terrainH(px,pz);
    const h=5+Math.floor(hash(bx+i,3,bz)*4);
    for (let y=g+1;y<=g+h;y++) put(px,y,pz,pick(C.bamboo,px,y,pz));
    for (let dy=0;dy<=2;dy++) for (const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]])
      if (hash(px+dx,g+h+dy,pz+dz)>0.4) put(px+dx,g+h+dy,pz+dz,pick(C.bambooLeaf,px+dx,g+h+dy,pz+dz));
  }
}
bamboo(-22,-20,14); bamboo(24,28,12); bamboo(20,-22,10);

/* ================= trees ================= */
const cherrySpots = [];
function tree(tx,tz,type){
  const g = terrainH(tx,tz);
  const h = type==='pine' ? 5 : 3 + Math.floor(hash(tx,1,tz)*3);
  for (let y=g+1; y<=g+h; y++) put(tx,y,tz,C.trunk);
  if (type==='pine'){
    const layers=[[g+h-1,2.6],[g+h+1,2.0],[g+h+3,1.4],[g+h+5,0.9]];
    for (const [ly,r] of layers) for (let dx=-3;dx<=3;dx++) for (let dz=-3;dz<=3;dz++) for (let dy=-1;dy<=1;dy++){
      const yy=ly+dy; if (dx*dx+dz*dz+(dy*1.6)**2 <= r*r && hash(tx+dx,yy,tz+dz)>0.04)
        put(tx+dx,yy,tz+dz,pick(C.pine,tx+dx,yy,tz+dz));
    }
    for (let dy=0;dy<=1;dy++) put(tx,g+h+6+dy,tz,pick(C.pine,tx,g+h+6,tz));
  } else {
    const r = 2.6 + hash(tx,2,tz)*1.1, cy = g+h+1;
    const pal = type==='maple'?C.maple : type==='cherry'?C.cherry : C.leaf;
    if (type==='cherry') cherrySpots.push([tx,cy+2,tz]);
    for (let dx=-4; dx<=4; dx++) for (let dy=-1; dy<=4; dy++) for (let dz=-4; dz<=4; dz++) {
      if (dx*dx + dz*dz + (dy*1.35)**2 <= r*r && hash(tx+dx,dy,tz+dz) > 0.02)
        put(tx+dx, cy+dy, tz+dz, pick(pal,tx+dx,dy,tz+dz));
    }
  }
}
const trees = [
  [-17,-20,'maple'],[-20,-17,'pine'],[-14,-23,'cherry'],[-19,-22,'pine'],
  [-17,30,'cherry'],[-21,32,'maple'],[-12,36,'pine'],[-20,27,'oak'],
  [17,-18,'pine'],[22,-21,'maple'],[24,-17,'oak'],[14,-24,'cherry'],
  [28,27,'cherry'],[25,32,'maple'],[32,25,'pine'],[29,34,'oak'],
  [-30,18,'maple'],[-28,-8,'pine'],[30,8,'cherry'],[8,-30,'maple'],[-8,-28,'oak'],[0,-34,'pine'],
  [34,-6,'oak'],[-34,2,'maple'],[12,30,'pine'],[6,34,'cherry'],[-6,36,'maple'],[20,20,'oak']
];
for (const [tx,tz,t] of trees) tree(tx,tz,t);

/* ================= flowers + grass tufts ================= */
for (let x=-G; x<=G; x++) for (let z=-G; z<=G; z++) {
  const h = terrainH(x,z);
  if (V.get(K(x,h,z)) === undefined) continue;
  if (hash(x,5,z) > 0.965 && Math.abs(x)+Math.abs(z) > 12 && pondD(x,z) > 1.3) put(x,h+1,z,pick(C.flower,x,h+1,z));
  else if (hash(x,6,z) > 0.93 && Math.abs(x)+Math.abs(z) > 12 && pondD(x,z) > 1.3) put(x,h+1,z,shade(C.grass[1],0.8));
}

/* ================= scene ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 90, 210);

const hemi = new THREE.HemisphereLight(0x8fb3d9, 0x2a2018, 0.85);
const sun = new THREE.DirectionalLight(0xffd9a0, 2.2);
sun.position.set(55, 70, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-55,right:55,top:55,bottom:-55,near:1,far:200});
const moon = new THREE.DirectionalLight(0x7f9fd0, 0.5);
moon.position.set(-60, 50, -50);
scene.add(hemi, sun, moon);

const moonBall = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 24), new THREE.MeshBasicMaterial({color:0xf5f0dc}));
moonBall.position.set(-95, 85, -110); scene.add(moonBall);
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(400*3);
for (let i=0;i<400;i++){ const a=hash(i,1,2)*6.283, b=hash(i,3,4)*1.4;
  starPos[i*3]=Math.cos(a)*Math.cos(b)*260; starPos[i*3+1]=Math.abs(Math.sin(b))*180+30; starPos[i*3+2]=Math.sin(a)*Math.cos(b)*260; }
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xcfd8e8, size:0.9, transparent:true, opacity:0.8, fog:false})));

const geo = new THREE.BoxGeometry(1,1,1);
const m4 = new THREE.Matrix4(), col = new THREE.Color();
function buildMesh(keys, material){
  const mesh = new THREE.InstancedMesh(geo, material, keys.length);
  keys.forEach((k,i)=>{ const [x,y,z]=k.split('|').map(Number);
    m4.makeTranslation(x, y+0.5, z); mesh.setMatrixAt(i,m4); mesh.setColorAt(i, col.setHex(V.get(k))); });
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh); return mesh;
}
const waterSet = new Set(waterKeys.map(([x,z])=>K(x,0,z)));
// waterfall voxels are separate keys already in V; keep them in main mesh
const mainKeys = [...V.keys()].filter(k=>!waterSet.has(k));
buildMesh(mainKeys, new THREE.MeshStandardMaterial({roughness:0.85, metalness:0.05}));
const waterMesh = buildMesh([...waterSet], new THREE.MeshStandardMaterial({roughness:0.25, metalness:0.1, transparent:true, opacity:0.88}));

const topMesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({color:C.lantern}), lanternTops.length);
lanternTops.forEach(([x,y,z],i)=>{ m4.makeTranslation(x,y+0.5,z); topMesh.setMatrixAt(i,m4); });
scene.add(topMesh);
for (const [lx,lz] of lanterns){ const g=terrainH(lx,lz); const p=new THREE.PointLight(0xffa64d, 14, 18, 2); p.position.set(lx,g+4.6,lz); scene.add(p); }
const inner = new THREE.PointLight(0xffb45e, 22, 20, 2); inner.position.set(0,5,2); scene.add(inner);

/* fireflies */
const N = 160, fp = new Float32Array(N*3), fseed = new Float32Array(N);
for (let i=0;i<N;i++){ fp[i*3]=(hash(i,1,3)-0.5)*70; fp[i*3+1]=2+hash(i,2,5)*9; fp[i*3+2]=(hash(i,3,7)-0.5)*70; fseed[i]=hash(i,4,11)*6.283; }
const fgeo = new THREE.BufferGeometry(); fgeo.setAttribute('position', new THREE.BufferAttribute(fp,3));
const flies = new THREE.Points(fgeo, new THREE.PointsMaterial({color:0xffe08a, size:0.42, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false}));
scene.add(flies);

/* cherry petals */
const P = 260, pp = new Float32Array(P*3), pseed = new Float32Array(P);
for (let i=0;i<P;i++){ const s = cherrySpots[i % cherrySpots.length] || [0,10,0];
  pp[i*3]=s[0]+(hash(i,1,1)-0.5)*9; pp[i*3+1]=s[1]+hash(i,2,2)*6; pp[i*3+2]=s[2]+(hash(i,3,3)-0.5)*9; pseed[i]=hash(i,4,4); }
const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute('position', new THREE.BufferAttribute(pp,3));
const petals = new THREE.Points(pgeo, new THREE.PointsMaterial({color:0xf2c2cf, size:0.3, transparent:true, opacity:0.85, depthWrite:false}));
scene.add(petals);

/* renderer + camera */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 700);
camera.position.set(52, 40, 58);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 18, 0); controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
controls.minDistance = 20; controls.maxDistance = 160; controls.maxPolarAngle = 1.48;
window.__cam = {camera, controls};

const statsEl = document.getElementById('stats');
statsEl.textContent = V.size.toLocaleString() + ' voxels';

addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const wA = new THREE.Color(0x2e6fa8), wB = new THREE.Color(0x4593cc);
let frames = 0, lastT = performance.now(), fps = 0;
function loop(t){
  requestAnimationFrame(loop);
  const s = t*0.001;
  waterKeys.forEach(([x,z],i)=>{ const f = 0.5 + 0.5*Math.sin(s*1.6 + hash(x,3,z)*6.283);
    waterMesh.setColorAt(i, col.copy(wA).lerp(wB, f)); });
  waterMesh.instanceColor.needsUpdate = true;
  const pos = fgeo.attributes.position.array;
  for (let i=0;i<N;i++){ pos[i*3] += Math.sin(s*0.7+fseed[i])*0.006; pos[i*3+1] += Math.sin(s*1.3+fseed[i])*0.005; pos[i*3+2] += Math.cos(s*0.6+fseed[i])*0.006; }
  fgeo.attributes.position.needsUpdate = true;
  const ppos = pgeo.attributes.position.array;
  for (let i=0;i<P;i++){ ppos[i*3+1] -= 0.012 + pseed[i]*0.012; ppos[i*3] += Math.sin(s*1.1+pseed[i]*6.283)*0.01;
    if (ppos[i*3+1] < 1.2) ppos[i*3+1] = 12 + pseed[i]*6; }
  pgeo.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
  frames++; if (t-lastT > 1000){ fps = frames*1000/(t-lastT); frames=0; lastT=t;
    statsEl.textContent = V.size.toLocaleString() + ' voxels · ' + fps.toFixed(0) + ' fps'; }
}
requestAnimationFrame(loop);
} catch (e) { document.getElementById('stats').textContent = 'ERROR: ' + e.message + ' | step: ' + window.__step; }
</script>
</body>
</html>
